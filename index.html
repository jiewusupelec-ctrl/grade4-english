<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="theme-color" content="#3a9fc4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <title>Jeff小朋友的暑假快乐英语</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" /></noscript>
  <style>
    :root {
      --sky: #7ec8e3;
      --sky-deep: #3a9fc4;
      --sun: #ffd166;
      --leaf: #6bcb77;
      --coral: #ff6b6b;
      --cream: #fff8e7;
      --ink: #2d3436;
      --card: #ffffff;
      --shadow: 0 10px 30px rgba(45, 52, 54, 0.12);
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 130%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      font-family: "Open Sans", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 209, 102, 0.45), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(126, 200, 227, 0.55), transparent 40%),
        radial-gradient(circle at 70% 85%, rgba(107, 203, 119, 0.35), transparent 45%),
        linear-gradient(165deg, #e8f7fc 0%, #fff8e7 48%, #eaf9ef 100%);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 48px;
      padding-bottom: calc(48px + constant(safe-area-inset-bottom));
      padding-bottom: calc(48px + env(safe-area-inset-bottom));
      padding-left: 16px;
      padding-right: 16px;
    }

    header.hero {
      text-align: center;
      padding: 28px 12px 18px;
      position: relative;
    }

    .brand {
      font-size: clamp(1.35rem, 5.5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--sky-deep);
      text-shadow: none;
      animation: bob 3.2s ease-in-out infinite;
      line-height: 1.25;
      word-break: break-word;
    }

    .tagline {
      margin-top: 8px;
      font-size: clamp(0.85rem, 3.2vw, 1.05rem);
      color: #516068;
      line-height: 1.4;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pop {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes flipIn {
      from { transform: rotateY(90deg); opacity: 0; }
      to { transform: rotateY(0); opacity: 1; }
    }

    nav.tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 18px 0 22px;
    }

    .tab-btn {
      border: none;
      border-radius: 16px;
      padding: 14px 8px;
      min-height: 48px;
      font: inherit;
      font-size: clamp(0.95rem, 3.2vw, 1.15rem);
      font-weight: 700;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, background 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .tab-btn:hover { transform: translateY(-2px); }
    .tab-btn.active {
      background: var(--sky-deep);
      color: #fff;
    }

    .panel {
      display: none;
      animation: pop 0.35s ease;
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px 18px 26px;
      box-shadow: var(--shadow);
    }

    .panel.active { display: block; }

    h2 {
      font-size: clamp(1.15rem, 4.5vw, 1.45rem);
      margin-bottom: 6px;
      color: var(--sky-deep);
      line-height: 1.35;
      word-break: break-word;
    }

    .hint {
      color: #66757c;
      margin-bottom: 18px;
      font-size: 0.95rem;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr));
      gap: 14px;
    }

    .word-card {
      background: linear-gradient(160deg, #f0fbff, #fff9ec);
      border-radius: 18px;
      padding: 16px;
      border: 2px solid rgba(58, 159, 196, 0.15);
      transition: transform 0.2s ease;
    }

    .word-card:hover { transform: scale(1.03); }

    .word-en {
      font-size: 1.45rem;
      font-weight: 700;
      color: #1f6f8b;
    }

    .word-phonetic {
      font-size: 0.85rem;
      color: #7a8a92;
      margin: 2px 0 8px;
    }

    .word-zh {
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .example {
      font-size: 0.9rem;
      color: #516068;
      line-height: 1.4;
    }

    .speak-btn, .action-btn, .quiz-btn, .nav-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      min-height: 44px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--sun);
      color: var(--ink);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .speak-btn:active, .action-btn:active, .quiz-btn:active, .nav-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .action-btn.primary, .quiz-btn.primary { background: var(--leaf); color: #143d1f; }
    .action-btn.coral, .nav-btn.coral { background: var(--coral); color: #fff; }
    .action-btn.sky, .nav-btn.sky { background: var(--sky); color: #13485c; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: flex-start;
    }

    .toolbar > * {
      flex: 1 1 auto;
      min-width: max-content;
      text-align: center;
    }

    .book-nav .nav-btn {
      flex: 1;
      text-align: center;
    }

    .flash-stage {
      -webkit-perspective: 1000px;
      perspective: 1000px;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flash-card {
      width: 100%;
      max-width: 340px;
      height: 240px;
      position: relative;
      -webkit-transform-style: preserve-3d;
      transform-style: preserve-3d;
      -webkit-transition: -webkit-transform 0.55s ease;
      transition: transform 0.55s ease;
      cursor: pointer;
      animation: flipIn 0.4s ease;
    }

    .flash-card.flipped {
      -webkit-transform: rotateY(180deg);
      transform: rotateY(180deg);
    }

    .flash-face {
      position: absolute;
      inset: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 24px;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .flash-front {
      background: linear-gradient(145deg, #3a9fc4, #7ec8e3);
      color: #fff;
    }

    .flash-back {
      background: linear-gradient(145deg, #ffd166, #ffe8a3);
      color: var(--ink);
      -webkit-transform: rotateY(180deg);
      transform: rotateY(180deg);
    }

    .flash-word {
      font-size: clamp(1.5rem, 8vw, 2.4rem);
      font-weight: 700;
      text-align: center;
      word-break: break-word;
      padding: 0 8px;
    }
    .flash-meta { margin-top: 10px; font-size: 1.15rem; opacity: 0.95; text-align: center; }
    .progress { margin-top: 14px; text-align: center; color: #516068; }

    .quiz-item {
      background: #f7fcff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      border: 2px solid rgba(58, 159, 196, 0.12);
    }

    .quiz-item h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 2px solid #d7e8ef;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .option:hover { border-color: var(--sky-deep); }
    .option.correct { border-color: var(--leaf); background: #e9f9ec; }
    .option.wrong { border-color: var(--coral); background: #ffeaea; }
    .option input { accent-color: var(--sky-deep); }

    .score-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(120deg, #eaf9ef, #fff6d8);
      font-size: 1.15rem;
      font-weight: 600;
      display: none;
    }

    .score-box.show { display: block; }

    .book-frame {
      border-radius: 20px;
      overflow: hidden;
      background: #fffdf7;
      border: 3px solid rgba(58, 159, 196, 0.2);
      min-height: 360px;
      position: relative;
    }

    .book-page {
      display: none;
      padding: 20px 18px 24px;
      animation: pop 0.35s ease;
    }

    .book-page.active { display: block; }

    .scene {
      height: 180px;
      border-radius: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      font-size: 3.4rem;
      padding-bottom: 18px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.9;
    }

    .scene span { position: relative; z-index: 1; animation: bob 2.8s ease-in-out infinite; }
    .scene span:nth-child(2) { animation-delay: 0.3s; }
    .scene span:nth-child(3) { animation-delay: 0.6s; }

    .scene.park::before {
      background: linear-gradient(180deg, #87ceeb 0%, #87ceeb 55%, #7dce82 55%, #5bb86a 100%);
    }
    .scene.home::before {
      background: linear-gradient(180deg, #ffd89b 0%, #ffb347 40%, #f5e6c8 40%, #e8d5b0 100%);
    }
    .scene.school::before {
      background: linear-gradient(180deg, #a8d8ea 0%, #71c4d8 50%, #c4a574 50%, #b8956a 100%);
    }
    .scene.night::before {
      background: linear-gradient(180deg, #1a2744 0%, #2d3e5f 60%, #3d4f3a 60%, #2f3d2c 100%);
    }

    .story-text {
      font-size: 1.15rem;
      line-height: 1.7;
      text-align: center;
    }

    .story-text .zh {
      display: block;
      margin-top: 8px;
      color: #66757c;
      font-size: 0.95rem;
    }

    .page-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 14px 0;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c5d8e0;
    }

    .dot.on { background: var(--sky-deep); transform: scale(1.2); }

    .book-nav {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      margin-top: 22px;
      color: #7a8a92;
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      html { font-size: 112%; }

      .app {
        padding-top: 12px;
        padding-bottom: calc(28px + env(safe-area-inset-bottom));
      }

      header.hero { padding: 16px 4px 10px; }

      nav.tabs {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin: 12px 0 16px;
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 6px 0;
        background: linear-gradient(180deg, rgba(232, 247, 252, 0.96), rgba(232, 247, 252, 0.88));
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }

      .tab-btn {
        font-size: 1.08rem;
        font-weight: 700;
        padding: 15px 8px;
        min-height: 52px;
        line-height: 1.25;
      }

      .panel {
        padding: 16px 12px 20px;
        border-radius: 18px;
      }

      .hint { font-size: 0.88rem; margin-bottom: 12px; }

      .word-grid { grid-template-columns: 1fr; gap: 10px; }

      .word-card { padding: 14px; }

      .toolbar { gap: 8px; }

      .toolbar > * {
        flex: 1 1 calc(50% - 8px);
        min-width: 0;
      }

      .flash-stage { min-height: 220px; }

      .flash-card {
        width: min(100%, 100%);
        height: 210px;
      }

      .scene { height: 140px; font-size: 2.4rem; }

      .story-text { font-size: 1.02rem; line-height: 1.6; }

      .option {
        padding: 12px;
        min-height: 48px;
      }

      .book-nav { gap: 8px; }
    }

    @media (max-width: 380px) {
      html { font-size: 100%; }

      .brand { font-size: 1.2rem; }

      .tab-btn {
        font-size: 1rem;
        padding: 14px 6px;
      }

      .toolbar > * {
        flex: 1 1 100%;
      }
    }

    @media (min-width: 641px) and (max-width: 900px) {
      html { font-size: 120%; }
      .word-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="brand">Jeff小朋友的暑假快乐英语</div>
      <p class="tagline">四～五年级 · 每日单词 · 速记 · 绘本阅读</p>
      <p class="tagline" id="today-badge" style="margin-top:6px;font-weight:600;color:#3a9fc4;">今日内容准备中…</p>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab-btn active" data-tab="daily">每日单词</button>
      <button type="button" class="tab-btn" data-tab="flash">单词速记</button>
      <button type="button" class="tab-btn" data-tab="weekly">每周测评</button>
      <button type="button" class="tab-btn" data-tab="book">在线绘本</button>
    </nav>

    <!-- 每日单词 -->
    <section id="daily" class="panel active">
      <h2>今日单词</h2>
      <p class="hint" id="daily-date">今天要记住这些单词哦！点喇叭可以听发音。</p>
      <div class="toolbar">
        <button type="button" class="action-btn sky" id="refresh-daily">换一组</button>
        <button type="button" class="action-btn" id="speak-all">全部朗读</button>
      </div>
      <div class="word-grid" id="daily-words"></div>
    </section>

    <!-- 单词速记 -->
    <section id="flash" class="panel">
      <h2>单词速记</h2>
      <p class="hint">点击卡片翻转，看英文猜中文，或看中文想英文。</p>
      <div class="toolbar">
        <button type="button" class="action-btn sky" id="flash-prev">上一张</button>
        <button type="button" class="action-btn primary" id="flash-flip">翻转</button>
        <button type="button" class="action-btn sky" id="flash-next">下一张</button>
        <button type="button" class="action-btn" id="flash-speak">朗读</button>
      </div>
      <div class="flash-stage">
        <div class="flash-card" id="flash-card">
          <div class="flash-face flash-front">
            <div class="flash-word" id="flash-front-text">apple</div>
            <div class="flash-meta">点击翻转</div>
          </div>
          <div class="flash-face flash-back">
            <div class="flash-word" id="flash-back-text">苹果</div>
            <div class="flash-meta" id="flash-back-meta">/ˈæpl/</div>
          </div>
        </div>
      </div>
      <p class="progress" id="flash-progress">1 / 10</p>
    </section>

    <!-- 每周测评 -->
    <section id="weekly" class="panel">
      <h2>每周单词测评</h2>
      <p class="hint">本周共 8 题，选出正确的意思或单词。加油！</p>
      <div id="quiz-list"></div>
      <div class="toolbar">
        <button type="button" class="quiz-btn primary" id="submit-quiz">交卷看分数</button>
        <button type="button" class="quiz-btn" id="reset-quiz">再测一次</button>
      </div>
      <div class="score-box" id="score-box"></div>
    </section>

    <!-- 在线绘本 -->
    <section id="book" class="panel">
      <h2 id="book-title">绘本阅读</h2>
      <p class="hint" id="book-hint">先读完故事，再做后面的 3 道阅读理解题。点“朗读本页”可听更自然的语音。</p>

      <div id="book-reader">
        <div class="book-frame" id="book-pages"></div>
        <div class="page-dots" id="page-dots"></div>
        <div class="book-nav">
          <button type="button" class="nav-btn" id="book-prev">上一页</button>
          <button type="button" class="nav-btn sky" id="book-speak">朗读本页</button>
          <button type="button" class="nav-btn coral" id="book-next">下一页</button>
        </div>
      </div>

      <div id="book-quiz" class="hidden">
        <h2 style="margin-top:8px">阅读理解（3题）</h2>
        <p class="hint">根据刚才的绘本，选择正确答案。</p>
        <div id="reading-quiz"></div>
        <div class="toolbar">
          <button type="button" class="quiz-btn primary" id="submit-reading">提交答案</button>
          <button type="button" class="quiz-btn" id="reread-book">再读一遍</button>
        </div>
        <div class="score-box" id="reading-score"></div>
      </div>
    </section>

    <footer>支持 iPhone Safari · 每天早上自动更新单词和绘本</footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
