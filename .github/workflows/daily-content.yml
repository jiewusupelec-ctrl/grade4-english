name: Daily content refresh

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate daily.json
        run: |
          python3 <<'PY'
          from datetime import datetime, timezone, timedelta
          import json
          tz = timezone(timedelta(hours=8))
          now = datetime.now(tz)
          date = now.strftime("%Y-%m-%d")
          word_seed = int(now.strftime("%Y%m%d"))
          day_of_year = int(now.strftime("%j"))
          story_index = (day_of_year - 1) % 7
          data = {
              "date": date,
              "wordSeed": word_seed,
              "storyIndex": story_index,
              "updatedAt": now.isoformat(),
              "note": "Auto refreshed for Jeff's summer English"
          }
          with open("daily.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(data, ensure_ascii=False))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh daily content for $(date -u +%F)"
            git push
          fi
